stages:

  data_ingestion:

    cmd: python src/cnnClassifier/pipeline/stage_01_data_ingestion.py

    deps:
      - src/cnnClassifier/pipeline/stage_01_data_ingestion.py
      - src/cnnClassifier/components/data_ingestion.py
      - config/config.yaml

    outs:
      - artifacts/data_ingestion/CT-KIDNEY-DATASET-Normal-Cyst-Tumor-Stone/CT-KIDNEY-DATASET-Normal-Cyst-Tumor-Stone


  prepare_base_model:

    cmd: python src/cnnClassifier/pipeline/stage_02_prepare_base_model.py

    deps:
      - src/cnnClassifier/pipeline/stage_02_prepare_base_model.py
      - src/cnnClassifier/components/prepare_base_model.py
      - config/config.yaml
      - params.yaml

    params:
      - IMAGE_SIZE
      - INCLUDING_TOP
      - CLASSES
      - WEIGHTS
      - LEARNING_RATE

    outs:
      - artifacts/prepare_base_model/base_model.h5
      - artifacts/prepare_base_model/updated_base_model.h5


  training:

    cmd: python src/cnnClassifier/pipeline/stage_03_model_training.py

    deps:
      - src/cnnClassifier/pipeline/stage_03_model_training.py
      - src/cnnClassifier/components/model_training.py
      - config/config.yaml
      - params.yaml
      - artifacts/data_ingestion/CT-KIDNEY-DATASET-Normal-Cyst-Tumor-Stone/CT-KIDNEY-DATASET-Normal-Cyst-Tumor-Stone
      - artifacts/prepare_base_model/updated_base_model.h5

    params:
      - IMAGE_SIZE
      - EPOCHS
      - BATCH_SIZE
      - AUGMENTATION
      - LEARNING_RATE

    outs:
      - artifacts/training/trained_model.h5
      - artifacts/training/best_model.h5
      - artifacts/class_indices.json


  evaluation:

    cmd: python src/cnnClassifier/pipeline/stage_04_model_evaluation_mlflow.py

    deps:
      - src/cnnClassifier/pipeline/stage_04_model_evaluation_mlflow.py
      - src/cnnClassifier/components/model_evaluation_mlflow.py
      - config/config.yaml
      - params.yaml
      - artifacts/data_ingestion/CT-KIDNEY-DATASET-Normal-Cyst-Tumor-Stone/CT-KIDNEY-DATASET-Normal-Cyst-Tumor-Stone
      - artifacts/training/trained_model.h5

    params:
      - IMAGE_SIZE
      - BATCH_SIZE

    metrics:
      - scores.json:
          cache: false